name: Cleanup Vercel preview

on:
  pull_request:
    types: [closed]

jobs:
  cleanup:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
      BRANCH: ${{ github.event.pull_request.head.ref }}
    steps:
      - name: Delete preview deployments of the merged branch
        run: |
          team="${VERCEL_TEAM_ID:+teamId=$VERCEL_TEAM_ID}"
          # ponytail: only the latest 100 previews are scanned; paginate via pagination.next if a branch ever exceeds that
          ids=$(curl -fsS -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&target=preview&limit=100&$team" \
            | jq -r --arg b "$BRANCH" '.deployments[] | select(.meta.githubCommitRef == $b) | .uid')
          for id in $ids; do
            echo "Deleting $id"
            curl -fsS -X DELETE -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v13/deployments/$id?$team"
          done
